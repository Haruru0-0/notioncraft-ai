name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity. This makes one tiny read every three days
# so the project never counts as idle. Run it by hand from the Actions tab to check the setup.
on:
  schedule:
    - cron: '23 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row through the Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # The public publishable key is enough: row security hides the data, but the request still reaches the database.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
            "${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase answered HTTP $status"
          # 200 is the normal answer. A paused project answers 5xx or times out, which fails this run and emails you.
          [ "$status" = "200" ]
